<html>
    <head>
        <title>Font Styles</title>
        <style>
            h1 {
                font-family: Arial, sans-serif;
                font-size: 24px;
                color: #333;
            }
            p {
                font-family: Georgia, serif;
                font-size: 16px;
                color: #666;
            }
        </style>
    </head>
    <body>
        <h1>This is a heading</h1>
        <p>This is a paragraph.</p>
        <p>This is another paragraph.</p>
    </body>
</html>
